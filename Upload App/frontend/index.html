<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transmit — File Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="noise"></div>

<main class="wrap">
  <header class="head">
    <div class="head__eyebrow">
      <span class="dot"></span> uplink ready
    </div>
    <h1 class="head__title">Send it up.</h1>
    <p class="head__sub">Drop a file below, or pick one. JPG, PNG, GIF, WEBP, PDF — up to 10MB.</p>
  </header>

  <section class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a file">
    <input type="file" id="fileInput" hidden accept=".jpg,.jpeg,.png,.gif,.webp,.pdf" />

    <div class="dropzone__idle" id="idleState">
      <svg class="dropzone__icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 6L24 30M24 6L15 15M24 6L33 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 30V37C8 39.2091 9.79086 41 12 41H36C38.2091 41 40 39.2091 40 37V30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="dropzone__label">Drag &amp; drop, or <span class="link">browse files</span></p>
      <p class="dropzone__hint">One file at a time · max 10MB</p>
    </div>

    <div class="dropzone__staged" id="stagedState" hidden>
      <div class="staged__preview" id="stagedPreview"></div>
      <div class="staged__meta">
        <p class="staged__name" id="stagedName"></p>
        <p class="staged__size" id="stagedSize"></p>
      </div>
      <div class="staged__actions">
        <button class="btn btn--ghost" id="clearBtn" type="button">Remove</button>
        <button class="btn btn--primary" id="sendBtn" type="button">Upload</button>
      </div>
    </div>

    <div class="dropzone__transmitting" id="transmitState" hidden>
      <div class="transmit__label">
        <span id="transmitName"></span>
        <span id="transmitPercent">0%</span>
      </div>
      <div class="transmit__bar" aria-hidden="true">
        <div class="transmit__segments" id="segments"></div>
      </div>
      <p class="transmit__status" id="transmitStatus">transmitting…</p>
    </div>
  </section>

  <p class="error" id="errorMsg" hidden></p>

  <section class="results" id="results">
    <div class="results__head">
      <h2>Received</h2>
      <span class="results__count" id="resultsCount">0</span>
    </div>
    <div class="results__grid" id="resultsGrid">
      <p class="results__empty" id="resultsEmpty">Nothing uploaded yet — send your first file above.</p>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
